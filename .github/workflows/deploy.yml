# Deploys the app to the live server whenever the "live" branch changes.
# Setup (server user, SSH key, and GitHub secrets): see docs/deploy.md.
#
# The deploy key is locked to rsync inside the app folder on the server with
# command="/usr/bin/rrsync /var/www/example.com/app" in authorized_keys, so a
# deploy can never reach anything outside that folder. That's also why there's
# no path setting here: the server decides where the app goes.

name: Deploy to live

on:
  push:
    branches: [live]
  workflow_dispatch: # lets you re-run a deploy from the Actions tab

# One deploy at a time; a newer push waits for the current one to finish.
concurrency:
  group: deploy-live
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: live
    timeout-minutes: 10

    steps:
      - name: Check out the live branch
        uses: actions/checkout@v5

      - name: Check PHP syntax
        run: find app -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          echo "SSH_CMD=ssh -i $HOME/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20" >> "$GITHUB_ENV"

      # Last check before anything is deleted: the server folder must be empty
      # or already hold this app (bootstrap.php). Anything else means the key
      # points at the wrong folder. Server details are secrets, so they stay
      # hidden in this public repo's logs.
      - name: Check the server folder
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ vars.DEPLOY_USER || secrets.DEPLOY_USER }}
        run: |
          if ! listing=$(rsync --list-only -e "$SSH_CMD" "$USER@$HOST:." 2>&1); then
            case "$listing" in
              *"error in libcrypto"*|*"invalid format"*|*"Load key"*)
                hint="DEPLOY_SSH_KEY isn't a readable private key. Paste the whole file again, including the BEGIN and END lines." ;;
              *"Host key verification failed"*)
                hint="DEPLOY_KNOWN_HOSTS doesn't match DEPLOY_HOST. Run ssh-keyscan -t ed25519 against the exact IP or hostname in DEPLOY_HOST (not an SSH shortcut) and paste the output." ;;
              *"Permission denied"*)
                hint="The server rejected the key. Check that DEPLOY_SSH_KEY is the whole private key (BEGIN and END lines included) and that its public half is in the deploy user's authorized_keys." ;;
              *"timed out"*|*"Connection refused"*|*"No route to host"*)
                hint="GitHub couldn't connect to the server. Check DEPLOY_HOST, and whether a firewall limits SSH to certain IPs." ;;
              *"Could not resolve hostname"*)
                hint="DEPLOY_HOST isn't a hostname GitHub can look up. Use the server's IP address." ;;
              *rrsync*)
                hint="The server's rrsync refused the request; see rsync's message." ;;
              *)
                hint="See rsync's message." ;;
            esac
            # The reason goes in the annotation itself, so it shows on the run's
            # summary page; the host is hidden.
            reason=$(printf '%s\n' "$listing" | grep -v '^\s*$' | grep -iv 'rsync error: unexplained\|connection unexpectedly closed' | sed "s#$HOST#<host>#g" | head -3)
            msg="$hint%0A%0Arsync said: $(printf '%s' "$reason" | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')"
            echo "::error title=Couldn't reach the server::$msg"
            exit 1
          fi
          entries=$(printf '%s\n' "$listing" | awk '{print $NF}' | grep -vx '\.' || true)
          if [ -n "$entries" ] && ! printf '%s\n' "$entries" | grep -qx bootstrap.php; then
            echo "::error::The server folder isn't empty and doesn't contain bootstrap.php, so it doesn't look like the app folder. Nothing was deployed." >&2
            exit 1
          fi

      # The footer shows "v0.3.0 · a1b2c3d" from this, so it's easy to tell
      # which version is running and to include it in feedback.
      - name: Stamp the build
        run: |
          printf '{"commit":"%s","date":"%s"}\n' "${GITHUB_SHA::7}" "$(date -u +%Y-%m-%dT%H:%MZ)" > app/build.json
          cat app/build.json

      - name: Deploy app
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ vars.DEPLOY_USER || secrets.DEPLOY_USER }}
        run: |
          rsync -rlz --delete --delay-updates --chmod=D755,F644 \
            --exclude /config.php --exclude .DS_Store \
            -e "$SSH_CMD" \
            app/ "$USER@$HOST:."

      - name: Clean up the SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
